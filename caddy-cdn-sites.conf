cdn.satkaconnect.xyz {
	tls {
		protocols tls1.2 tls1.3
	}

	header {
		-Server
		Cache-Control "no-store,no-cache,must-revalidate"
		Surrogate-Control "no-store"
		Pragma "no-cache"
	}

	handle_path /health {
		header Content-Type "application/json"
		respond `{"status":"ok","service":"stream-vault","version":"5.4.2"}` 200
	}

	@tunnel {
		path /session/preview*
	}
	handle @tunnel {
		reverse_proxy 127.0.0.1:7443 {
			flush_interval -1
			header_up Host {host}
			header_up X-Real-IP {remote_host}
			transport http {
				versions h2c 1.1
				keepalive_idle_conns 256
				keepalive 30s
			}
		}
	}

	handle {
		root * /var/www/html
		try_files {path} /index.html
		file_server
	}
}
